name: Build RISC-V runner

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [ self-hosted, Linux, riscv64 ]

    steps:
    - name: Clone repositories
      uses: actions/checkout@v4
      with:
        repository: revyos/runner
        ref: revyos/riscv64_runner_2.328.0
        path: runner

    - name: Download .NET
      run: |
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/dotnet-sdk-8.0.101-linux-riscv64.tar.gz
        mkdir -p $GITHUB_WORKSPACE/packages
        cd $GITHUB_WORKSPACE/packages
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.AspNetCore.App.Runtime.linux-riscv64.8.0.1-servicing.23580.8.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.AspNetCore.App.Runtime.linux-riscv64.8.0.1-servicing.23580.8.symbols.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.AspNetCore.App.Runtime.linux-riscv64.8.0.1.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.AspNetCore.App.Runtime.linux-riscv64.8.0.1.symbols.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.NETCore.App.Host.linux-riscv64.8.0.1.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.NETCore.App.Host.linux-riscv64.8.0.1.symbols.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.NETCore.App.Runtime.linux-riscv64.8.0.1-servicing.23580.1.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.NETCore.App.Runtime.linux-riscv64.8.0.1-servicing.23580.1.symbols.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.NETCore.App.Runtime.linux-riscv64.8.0.1.nupkg
        wget https://github.com/dkurt/dotnet_riscv/releases/download/v8.0.101/Microsoft.NETCore.App.Runtime.linux-riscv64.8.0.1.symbols.nupkg

    - name: Prepare
      run: |
        cd runner
        sed -i "s|/home/ubuntu/packages|$GITHUB_WORKSPACE|" src/NuGet.Config

        mkdir -p _dotnetsdk/8.0.101
        cd _dotnetsdk/8.0.101
        tar -xf $GITHUB_WORKSPACE/dotnet-sdk-8.0.101-linux-riscv64.tar.gz

    - name: Build
      run: |
        cd runner/src
        ./dev.sh layout Release linux-riscv64

    - name: Package
      run: |
        cd runner/src
        ./dev.sh package Release linux-riscv64

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: actions-runner-linux-riscv64
        path: "runner/_package/actions-runner-linux-riscv64-*.tar.gz"

    - name: 'Upload Release'
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: runner/_package/actions-runner-linux-riscv64-*.tar.gz
        token: ${{ secrets.GITHUB_TOKEN }}
